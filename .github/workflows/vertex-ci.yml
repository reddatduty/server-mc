name: Vertex Windows CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'vertex-final/**'
      - '.github/workflows/vertex-ci.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct exact Vertex 0.3.1 source
        shell: pwsh
        run: |
          $names = @(
            'final00.txt','final01.txt','final02.txt','final03.txt',
            'final04a.txt','final04b.txt','final04c.txt',
            'final05.txt','final06.txt','final07.txt','final08.txt','final09.txt'
          )
          $b64 = ($names | ForEach-Object { Get-Content (Join-Path 'vertex-final' $_) -Raw }) -join ''
          [IO.File]::WriteAllBytes('Vertex-Launcher-0.3.1-Source.zip', [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash 'Vertex-Launcher-0.3.1-Source.zip' -Algorithm SHA256).Hash.ToLower()
          $expected = '7dc0e2f945a7f858a4d81f8e5f4d8d2d853a9ccf8dfec69c1ff887994c2c5f7a'
          if ($actual -ne $expected) { throw "Source checksum mismatch: $actual" }
          Expand-Archive 'Vertex-Launcher-0.3.1-Source.zip' vertex-src -Force
          $pkg = Get-Content vertex-src/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.3.1') { throw "Wrong package version: $($pkg.version)" }
          if ((Get-Content vertex-src/src-tauri/src/lib.rs -Raw) -notmatch 'create_offline_account') { throw 'Offline backend missing.' }
          if ((Get-Content vertex-src/src/App.vue -Raw) -notmatch 'Offline Mode') { throw 'Offline Mode UI missing.' }

      - name: Install frontend dependencies
        working-directory: vertex-src
        run: npm install --no-audit --no-fund

      - name: Frontend build
        working-directory: vertex-src
        run: npm run build

      - name: Rust check
        working-directory: vertex-src
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        working-directory: vertex-src
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: vertex-launcher-0.3.1-windows
          path: vertex-src/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
