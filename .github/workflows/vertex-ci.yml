name: Vertex Windows CI

# Build trigger after corrected source upload
on:
  workflow_dispatch:
  push:
    paths:
      - 'vertex-ci/**'
      - '.github/workflows/vertex-ci.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct and verify source
        shell: pwsh
        run: |
          $names = @(
            'part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt',
            'part06a1.txt','part06a2.txt','part06b1.txt','part06b2.txt',
            'part07a.txt','part07b.txt'
          )
          $b64 = ($names | ForEach-Object { Get-Content (Join-Path 'vertex-ci' $_) -Raw }) -join ''
          [IO.File]::WriteAllBytes('vertex-source.zip', [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash vertex-source.zip -Algorithm SHA256).Hash.ToLower()
          $expected = 'a867c3d3a06bbd812378dbd2d60fe6864f1f36d52fccc71a011d99a986f0df33'
          if ($actual -ne $expected) { throw "Source checksum mismatch: $actual" }
          Expand-Archive vertex-source.zip vertex-src -Force

      - name: Apply source fixes
        working-directory: vertex-src
        shell: pwsh
        run: |
          $p = 'src-tauri/src/content.rs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('entry.enclosed_name().map(Path::to_path_buf)', 'entry.enclosed_name()')
          $s = $s.Replace('let mut installed = Vec::new();`n    let mut mod_count = 0u32;`n    for item in index.get("files")', 'let installed = Vec::new();`n    let mut mod_count = 0u32;`n    for item in index.get("files")')
          Set-Content $p $s -NoNewline

          $p = 'src-tauri/src/minecraft.rs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('entry.enclosed_name().map(Path::to_path_buf)', 'entry.enclosed_name()')
          $s = $s.Replace('use sha2::{Digest as Sha2Digest, Sha256, Sha512};', 'use sha2::{Sha256, Sha512};')
          $s = $s.Replace('io::{Read, Write},', 'io::Read,')
          Set-Content $p $s -NoNewline

          $p = 'src-tauri/src/instance_tools.rs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('io::{Read, Write}', 'io::Read')
          Set-Content $p $s -NoNewline

      - name: Fix frontend dependency pin
        working-directory: vertex-src
        shell: pwsh
        run: npm pkg set devDependencies.typescript=5.9.3

      - name: Install frontend dependencies
        working-directory: vertex-src
        run: npm install --no-audit --no-fund

      - name: Frontend build
        working-directory: vertex-src
        run: npm run build

      - name: Rust check
        working-directory: vertex-src
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        working-directory: vertex-src
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: vertex-launcher-windows
          path: vertex-src/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
